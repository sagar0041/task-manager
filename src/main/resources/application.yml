spring:
  application:
    name: task-manager

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskmanager}
    username: ${DB_USER:taskmanager}
    password: ${DB_PASSWORD:taskmanager}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    default_schema: public

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/taskmanager

server:
  port: 8080

keycloak:
  realm: taskmanager
  auth-server-url: http://localhost:8180
  client-id: task-manager-backend
  client-secret: ${KEYCLOAK_CLIENT_SECRET}