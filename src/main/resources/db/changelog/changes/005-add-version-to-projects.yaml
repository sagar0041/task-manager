databaseChangeLog:
  - changeSet:
      id: 005
      author: sagarpatil
      changes:
        - addColumn:
            tableName: projects
            columns:
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: projects
            columnName: version