databaseChangeLog:
  - changeSet:
      id: 003
      author: sagarpatil
      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: BACKLOG
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: VARCHAR(20)
                  defaultValue: MEDIUM
                  constraints:
                    nullable: false
              - column:
                  name: project_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_task_project
                    references: projects(id)
              - column:
                  name: assigned_to
                  type: VARCHAR(36)
                  constraints:
                    foreignKeyName: fk_task_assigned_to
                    references: users(id)
              - column:
                  name: created_by
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_task_created_by
                    references: users(id)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: tasks