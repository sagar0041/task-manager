<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 840" width="1060" height="840" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="840" fill="#ffffff"/>

  <!-- ===== Title ===== -->
  <text x="530" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#202124">Task Manager — System Architecture</text>
  <text x="530" y="72" text-anchor="middle" font-size="13" fill="#5f6368">Spring Boot 3 · Keycloak OAuth2/OIDC · PostgreSQL + Liquibase · Angular</text>

  <!-- ===== Angular ===== -->
  <rect x="70" y="110" width="370" height="150" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.6"/>
  <text x="92" y="141" font-size="17" font-weight="700" fill="#1a73e8">Angular Frontend</text>
  <text x="92" y="161" font-size="12" fill="#5f6368">localhost:4200</text>
  <text x="92" y="188" font-size="12.5" fill="#3c4043">• keycloak-angular · Authorization Code + PKCE</text>
  <text x="92" y="209" font-size="12.5" fill="#3c4043">• Access token held in memory (XSS-safe)</text>
  <text x="92" y="230" font-size="12.5" fill="#3c4043">• Public client: task-manager-frontend</text>

  <!-- ===== Keycloak ===== -->
  <rect x="620" y="110" width="370" height="200" rx="10" fill="#fdecea" stroke="#d93025" stroke-width="1.6"/>
  <text x="642" y="141" font-size="17" font-weight="700" fill="#d93025">Keycloak 24</text>
  <text x="642" y="161" font-size="12" fill="#5f6368">localhost:8180 · realm: taskmanager</text>
  <text x="642" y="188" font-size="12.5" fill="#3c4043">• task-manager-frontend — public client</text>
  <text x="642" y="209" font-size="12.5" fill="#3c4043">• task-manager-backend — confidential client</text>
  <text x="642" y="230" font-size="12.5" fill="#3c4043">• Realm roles: ADMIN · PROJECT_MANAGER</text>
  <text x="656" y="250" font-size="12.5" fill="#3c4043">· DEVELOPER</text>
  <text x="642" y="275" font-size="12.5" fill="#3c4043">• Signs JWTs with its RS256 private key</text>

  <!-- ===== Arrow 1: Angular -> Keycloak (login) ===== -->
  <line x1="443" y1="167" x2="613" y2="167" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="528" y="155" text-anchor="middle" font-size="11.5" fill="#5f6368">1. Login redirect (PKCE)</text>
  <line x1="617" y1="197" x2="447" y2="197" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="528" y="216" text-anchor="middle" font-size="11.5" fill="#5f6368">JWT: access + refresh</text>

  <!-- ===== Arrow 2: Angular -> Spring Boot ===== -->
  <line x1="255" y1="263" x2="255" y2="364" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="272" y="305" font-size="11.5" fill="#5f6368">2. API calls</text>
  <text x="272" y="322" font-size="11.5" fill="#5f6368">Authorization: Bearer &lt;JWT&gt;</text>

  <!-- ===== Spring Boot ===== -->
  <rect x="70" y="370" width="370" height="250" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="1.6"/>
  <text x="92" y="401" font-size="17" font-weight="700" fill="#188038">Spring Boot API</text>
  <text x="92" y="421" font-size="12" fill="#5f6368">localhost:8080</text>

  <rect x="92" y="436" width="326" height="34" rx="5" fill="#f4faf6" stroke="#a8d5b5"/>
  <text x="106" y="458" font-size="12" fill="#3c4043">Controllers · @AuthenticationPrincipal Jwt</text>

  <rect x="92" y="478" width="326" height="34" rx="5" fill="#f4faf6" stroke="#a8d5b5"/>
  <text x="106" y="500" font-size="12" fill="#3c4043">Services · @PreAuthorize + ownership checks</text>

  <rect x="92" y="520" width="326" height="34" rx="5" fill="#f4faf6" stroke="#a8d5b5"/>
  <text x="106" y="542" font-size="12" fill="#3c4043">Repositories · Spring Data JPA</text>

  <rect x="92" y="562" width="326" height="34" rx="5" fill="#f4faf6" stroke="#a8d5b5"/>
  <text x="106" y="584" font-size="12" fill="#3c4043">SecurityConfig · OAuth2 Resource Server</text>

  <!-- ===== Arrow 3: Spring Boot -> Keycloak (JWKS) ===== -->
  <polyline points="443,410 745,410 745,315" fill="none" stroke="#5f6368" stroke-width="1.6"
            stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="596" y="399" text-anchor="middle" font-size="11.5" fill="#5f6368">3. Fetch JWKS public key (once at startup)</text>

  <!-- ===== Key design notes ===== -->
  <rect x="480" y="450" width="350" height="225" rx="8" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.4"/>
  <text x="498" y="477" font-size="13" font-weight="700" fill="#202124">Key design decisions</text>
  <text x="498" y="502" font-size="11" fill="#3c4043">• Public key cached at startup — every JWT is</text>
  <text x="508" y="521" font-size="11" fill="#3c4043">validated locally, zero calls to Keycloak per request</text>
  <text x="498" y="545" font-size="11" fill="#3c4043">• Custom JwtAuthenticationConverter reads</text>
  <text x="508" y="564" font-size="11" fill="#3c4043">Keycloak's nested realm_access.roles claim</text>
  <text x="498" y="588" font-size="11" fill="#3c4043">• JIT provisioning creates the local User row on</text>
  <text x="508" y="607" font-size="11" fill="#3c4043">the first authenticated request, from JWT claims</text>
  <text x="498" y="631" font-size="11" fill="#3c4043">• Separate databases keep the app's and Keycloak's</text>
  <text x="508" y="650" font-size="11" fill="#3c4043">Liquibase changelogs fully isolated</text>

  <!-- ===== Arrow 4: Spring Boot -> Postgres ===== -->
  <line x1="255" y1="623" x2="255" y2="694" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="272" y="664" font-size="11.5" fill="#5f6368">JDBC · Liquibase</text>

  <!-- ===== Arrow 5: Keycloak -> Postgres ===== -->
  <line x1="865" y1="313" x2="865" y2="694" stroke="#5f6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="878" y="500" font-size="11.5" fill="#5f6368">JDBC</text>

  <!-- ===== PostgreSQL ===== -->
  <rect x="70" y="700" width="920" height="120" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.6"/>
  <text x="92" y="729" font-size="16" font-weight="700" fill="#b06000">PostgreSQL 16 · localhost:5432</text>

  <rect x="95" y="744" width="400" height="58" rx="6" fill="#ffffff" stroke="#f9ab00"/>
  <text x="112" y="769" font-size="13" font-weight="600" fill="#202124">taskmanager</text>
  <text x="112" y="788" font-size="11" fill="#5f6368">application schema · managed by Liquibase</text>

  <rect x="560" y="744" width="400" height="58" rx="6" fill="#ffffff" stroke="#f9ab00"/>
  <text x="577" y="769" font-size="13" font-weight="600" fill="#202124">keycloak</text>
  <text x="577" y="788" font-size="11" fill="#5f6368">Keycloak's own internal schema</text>

</svg>
