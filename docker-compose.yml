services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager
      POSTGRES_MULTIPLE_DATABASES: taskmanager,keycloak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: taskmanager
      KC_DB_PASSWORD: taskmanager
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/taskmanager-realm.json:/opt/keycloak/data/import/taskmanager-realm.json
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata: